{% extends 'base.html' %}

{% block content %}
<h1>{% block title %} Create a New Password {% endblock %}</h1>

<form method="post" action="/create">
    <div class="form-group">
        <label for="url">Url</label>
        <input type="URL" name="email_URL" placeholder="Email URL" class="form-control" value="{{ request.form['email_URL']}}" />

    </div>
    <div class="form-group">
        <label for="email">Email</label>
        <input type="text" name="email"
               placeholder="Password email" class="form-control"
               value="{{ request.form['email'] }}"/>
    </div>

    <div class="form-group">
        <label for="email_password">Email_password</label>
        <textarea name="email_password" placeholder="Password"
                  class="form-control">{{ request.form['email_password'] }}</textarea>
    </div>
    <div class="form-group">
        <button type="submit" class="btn btn-primary">Submit</button>
    </div>
</form>
{% endblock %}
