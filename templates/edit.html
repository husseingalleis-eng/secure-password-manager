{% extends 'base.html' %}

{% block content %}
<h1>{% block title %} Edit "{{ password['email'] }}" {% endblock %}</h1>

<form method="POST">
    <div class="form-group">
        <label for="email">Email</label>
        <input type="text" name="email" placeholder="Password email"
               class="form-control"
               value="{{ request.form['email'] or password['email'] }}">
        </input>
    </div>

    <div class="form-group">
        <label for="email_password">Email_password</label>
        <textarea name="email_password" placeholder="Password"
                  class="form-control">{{ request.form['email_password'] or password['email_password'] }}</textarea>
    </div>
    <div class="form-group">
        <button type="submit" class="btn btn-primary">Submit</button>
    </div>
</form>
<hr>

<form action="{{ url_for('delete', id=password['id'])}}" method="POST">
    <input type="submit" value="Delete Password" class="btn btn-danger btn-sm"
            onclick="return confirm('Are you sure you want to delete this password?')">
</form>
{% endblock %}
